<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets · Mini QA Tickets</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/index.html">Mini QA Tickets</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="/index.html">Home</a>
      <a class="active" href="/tickets.html">Tickets</a>
      <a href="/new-ticket.html">New Ticket</a>
      <a href="/api-docs.html">API Docs</a>
    </nav>
  </header>

  <main class="container">
    <h1>Tickets</h1>
    <section class="toolbar" aria-label="Ticket filters">
      <input id="searchInput" data-testid="ticket-search" type="search" placeholder="Search by title, project or description" />
      <select id="statusFilter" data-testid="status-filter">
        <option value="">All statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
      <select id="priorityFilter" data-testid="priority-filter">
        <option value="">All priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <button id="clearFilters" data-testid="clear-filters">Clear</button>
    </section>
    <section id="ticketList" class="ticket-list" data-testid="ticket-list"></section>
  </main>

  <script src="/js/tickets.js"></script>
</body>
</html>
